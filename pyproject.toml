[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lip"
version = "0.1.0"
description = "Paraphrase-before-monitor defense against actor-monitor collusion, built on ControlArena"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["bandit==1.9.4", "pip-audit==2.10.1", "pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# slow = needs Docker or a local Ollama model; `pytest -m slow` runs them locally
addopts = "-m 'not slow'"
markers = ["slow: needs Docker or a local Ollama model (local only)"]
