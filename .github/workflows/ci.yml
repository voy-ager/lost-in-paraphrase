name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # CI calls no model provider and downloads no weights; tests use Inspect's mockllm
      INSPECT_EVAL_MODEL: mockllm/model
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans every commit
      - name: secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release checksums file
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: |
          # runner's bundled setuptools has known advisories; it is a build tool, not a project dep
          pip install --upgrade "setuptools>=84.1.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: tests
        # exit code 5 = no tests collected yet
        run: pytest -q || [ $? -eq 5 ]
      - name: results scrub
        run: python scripts/scrub_check.py
      - name: security scan (our code)
        run: bandit -r . -x ./tests,./.venv -q
      - name: dependency audit
        run: pip-audit --skip-editable
